name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf minisign

      - name: Install minisign on macOS
        if: runner.os == 'macOS'
        run: brew install minisign

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # rustup reads the version and the components from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the frontend format
        run: pnpm format:check

      - name: Lint the frontend
        run: pnpm lint

      - name: Check the frontend types
        run: pnpm typecheck

      - name: Test the frontend
        run: pnpm test

      - name: Build the frontend
        run: pnpm build

      # The test signs a small release with a temporary key, then runs install.sh on it.
      - name: Test the install script
        if: runner.os != 'Windows'
        run: pnpm test:install

      - name: Check the Rust format
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      # The Rust tests write src/ipc/bindings.ts again. A difference means the committed file is old.
      - name: Check that the IPC bindings are current
        run: git diff --exit-code src/ipc/bindings.ts
