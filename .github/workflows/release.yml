name: Release

# A tag such as v1.0.0 builds the installers and attaches them to a draft release.
# Publish the draft on GitHub. Then the updater of each installed copy finds it.
# A manual run builds the installers as workflow artifacts and makes no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create the draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag is the version of the application
        run: bash scripts/release/check-version.sh "$GITHUB_REF_NAME"

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "gitoverlord $GITHUB_REF_NAME" --generate-notes
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: release
    # A manual run has no release job. Build when the release job did not fail.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
          # The AppImage runs on systems with this glibc version or a newer one.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # rustup reads the version from rust-toolchain.toml.
      - name: Install the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the code signing variables that have a value
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: bash scripts/release/signing-env.sh

      - name: Set up Windows code signing
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          bash scripts/release/windows-signing.sh

      - name: Build the installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The updater checks each download with the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITOVERLORD_GITHUB_CLIENT_ID: ${{ vars.GITOVERLORD_GITHUB_CLIENT_ID }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
