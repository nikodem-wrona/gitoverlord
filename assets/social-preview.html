<!doctype html>
<!--
  The social preview of the GitHub repository, 1280 × 640 pixels.
  `pnpm social-preview` renders it to assets/social-preview.png.
  Upload that file in the repository settings, under Social preview.
  The colors are the colors of the Overlord theme in src/hud/tokens.css.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gitoverlord social preview</title>
    <style>
      @font-face {
        font-family: Rajdhani;
        font-weight: 700;
        src: url("../node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 100 800;
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2");
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "JetBrains Mono", monospace;
        color: #d6d6d6;
        background-color: #050505;
        background-image:
          linear-gradient(#111 1px, transparent 1px),
          linear-gradient(90deg, #111 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: -1px -1px;
      }
      .frame {
        position: absolute;
        inset: 36px;
        border: 1px solid #1e1e1e;
      }
      .corner {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 0 solid #fff;
      }
      .top-left {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
      }
      .top-right {
        top: -1px;
        right: -1px;
        border-width: 2px 2px 0 0;
      }
      .bottom-left {
        bottom: -1px;
        left: -1px;
        border-width: 0 0 2px 2px;
      }
      .bottom-right {
        right: -1px;
        bottom: -1px;
        border-width: 0 2px 2px 0;
      }
      .logo {
        position: absolute;
        top: 110px;
        left: 84px;
        width: 420px;
        height: 420px;
        mix-blend-mode: lighten;
      }
      .text {
        position: absolute;
        inset: 0 84px 0 540px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 18px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #74f8b2;
      }
      .tag::before {
        content: "";
        width: 10px;
        height: 10px;
        background: #74f8b2;
        box-shadow: 0 0 12px #74f8b2;
      }
      h1 {
        margin: 22px 0 26px;
        font-family: Rajdhani, sans-serif;
        font-size: 104px;
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #fff;
      }
      p {
        max-width: 620px;
        margin: 0;
        font-size: 25px;
        line-height: 1.5;
      }
      .stack {
        margin-top: 34px;
        font-size: 17px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a8a8a;
      }
      .stack span {
        padding: 0 10px;
        color: #383838;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <i class="corner top-left"></i><i class="corner top-right"></i>
      <i class="corner bottom-left"></i><i class="corner bottom-right"></i>
    </div>
    <img class="logo" src="logo-source.png" alt="" />
    <div class="text">
      <div class="tag">Open-source Git client</div>
      <h1>gitoverlord</h1>
      <p>A desktop Git client that looks like a futuristic control panel.</p>
      <div class="stack">
        Rust<span>/</span>Tauri 2<span>/</span>React<span>/</span>macOS · Linux
        · Windows
      </div>
    </div>
  </body>
</html>
