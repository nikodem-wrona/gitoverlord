[workspace]
resolver = "3"
members = ["crates/git-core", "crates/github", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nikodem-wrona/gitoverlord"
publish = false

[workspace.dependencies]
git-core = { path = "crates/git-core" }
github = { path = "crates/github" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# specta is a release candidate. Keep this pin in step with tauri-specta.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The limit is in clippy.toml.
too_many_lines = "warn"
unwrap_used = "warn"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
