[package]
name = "git-core"
description = "Git access for gitoverlord. This crate does not depend on Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# libgit2 does the read operations. The vendored build gives each platform the same version.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
notify-debouncer-mini = "0.8"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
